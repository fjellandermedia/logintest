<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<title>Logga in med Microsoft (PoC)</title>
<button id="login">Logga in med Microsoft</button>
<button id="logout" hidden>Logga ut</button>
<p id="out"></p>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"></script>
<script>
  const app = new msal.PublicClientApplication({
    auth: {
      clientId: "0bf3f0f5-1de8-46ba-8166-3d15b224c6e8",                              // från app-registreringen i Entra
      authority: "https://login.microsoftonline.com/88b7c9c5-a51c-4937-b951-243043fe6aaa",  // eller /<tenant-id> för bara er skola
      redirectUri: location.origin + location.pathname,
    },
  });

  app.initialize()
    .then(() => app.handleRedirectPromise())
    .then(result => {
      const account = result?.account ?? app.getAllAccounts()[0];
      if (account) {
        const c = account.idTokenClaims;
        document.getElementById("out").textContent =
          "Inloggad som: " + (c.email || c.preferred_username || account.username);
        document.getElementById("login").hidden = true;
        document.getElementById("logout").hidden = false;
      }
    })
    .catch(err => {
      document.getElementById("out").textContent = "Fel: " + (err.errorCode || "") + " " + err.message;
    });

  document.getElementById("login").onclick = () =>
    app.loginRedirect({ scopes: ["openid", "profile", "email"] });

  document.getElementById("logout").onclick = () =>
    app.logoutRedirect({ postLogoutRedirectUri: location.origin + location.pathname });
</script>
</html>
